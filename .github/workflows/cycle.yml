name: cycle

on:
  schedule:
    # Hourly; a failed reel waits out the pipeline's retry delay between attempts.
    - cron: "0 * * * *"
  workflow_dispatch:

# Never two cycles at once, and never cancel one mid-run: its queue state would be lost.
concurrency:
  group: kb-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    # A hung run would otherwise hold the concurrency lock for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The adapters shell out to ffmpeg/ffprobe (audio, frames) and tesseract (on-screen text).
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - run: uv sync --locked --no-dev
      - name: Run one cycle
        run: uv run --no-dev python -m instaautomation kb
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          HIKERAPI_KEY: ${{ secrets.HIKERAPI_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # Also after a failed cycle: the queue and Telegram offset are saved as the cycle goes,
      # and Telegram drops messages once the offset moves past them.
      - name: Commit knowledge-base changes
        if: always()
        run: |
          [ -d kb ] || exit 0
          git add kb
          if git diff --cached --quiet; then
            echo "No knowledge-base changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Knowledge base: cycle ${{ github.run_number }}"
          # Someone may have pushed to main during the run; a lost push race is retried.
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "::error::Could not push knowledge-base changes; the next run starts from the last pushed state."
          exit 1
