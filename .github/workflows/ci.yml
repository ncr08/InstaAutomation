name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The ffmpeg and tesseract adapters are tested against the real tools.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run mypy src tests scripts

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, not just the last commit: a key removed later is still leaked.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
