[project]
name = "instaautomation"
version = "0.1.0"
description = "Instagram reel to AI knowledge base pipeline"
authors = [
    { name = "Noah", email = "124786639+ncr08@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
